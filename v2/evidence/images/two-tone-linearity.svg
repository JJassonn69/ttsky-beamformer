<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="660" viewBox="0 0 1250 660" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Two-tone intermodulation pilot</title>
<desc id="svg-desc">Fundamental-to-worst-IM3 separation at two input amplitudes.</desc>
