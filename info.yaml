# Tiny Tapeout project information
project:
  title:        "Four-Channel Quadrature Low-IF Beamformer"
  author:       "Jason"
  discord:      ""
  description:  "A four-channel 5 MHz receive beamformer with four selectable phase-code beams, per-channel gain trim, and a differential 1 MHz output"
  language:     "Analog"
  clock_hz:     16000000
  tiles:        "2x2"
  analog_pins:  6
  uses_vapwr:   false
  top_module:   "tt_um_jjassonn69_beamformer"
  source_files:
    - "project.v"

pinout:
  ui[0]: "BEAM_SELECT_0"
  ui[1]: "BEAM_SELECT_1"
  ui[2]: "RX_DIRECTION_RESERVED"
  ui[3]: "MANUAL_MODE"
  ui[4]: "CH0_ENABLE"
  ui[5]: "CH1_ENABLE"
  ui[6]: "CH2_ENABLE"
  ui[7]: "CH3_ENABLE"

  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: "CFG_CLK"
  uio[1]: "CFG_DATA"
  uio[2]: "CFG_LATCH"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  ua[0]: "ELEMENT_INPUT_0"
  ua[1]: "ELEMENT_INPUT_1"
  ua[2]: "ELEMENT_INPUT_2"
  ua[3]: "ELEMENT_INPUT_3"
  ua[4]: "BEAM_OUT_P"
  ua[5]: "BEAM_OUT_N"

yaml_version: 6
