<text class="title" x="70.00" y="32">V3 per-channel selector placement skeleton</text>
<text class="small" x="461.28" y="80.00" fill="#273746">Reservation: 15.74 x 34.00 um</text>
<text class="small" x="461.28" y="105.00" fill="#273746">Raw cell utilization: 38.11%</text>
<text class="small" x="461.28" y="130.00" fill="#273746">Nine alternating R0/MX rows</text>
<text class="small" x="461.28" y="155.00" fill="#273746">12 mux2 + 4 and2 + 5 and2b + 5 taps</text>
<text class="small" x="461.28" y="180.00" fill="#273746">Maximum occupied row width: 9.20 um</text>
<text class="small" x="461.28" y="205.00" fill="#273746">Left: four-phase Metal 3 spine</text>
<text class="small" x="461.28" y="230.00" fill="#273746">Right: eight static-code Metal 2 entries</text>
<text class="small" x="461.28" y="255.00" fill="#273746">All four channels use this identical copy</text>
<text class="small" x="461.28" y="280.00" fill="#273746"></text>
<text class="label" x="461.28" y="305.00" fill="#273746">Still open:</text>
<text class="small" x="461.28" y="330.00" fill="#273746">- detailed LEF pin-access routing</text>
<text class="small" x="461.28" y="355.00" fill="#273746">- power straps and tap-rule signoff</text>
<text class="small" x="461.28" y="380.00" fill="#273746">- antenna, DRC, extraction and skew</text>
<text class="small" x="461.28" y="405.00" fill="#273746">- routed DEF/GDS generation</text>
