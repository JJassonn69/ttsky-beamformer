name: docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - "README.md"
      - "docs/**"
      - "gds/**"
      - "info.yaml"
      - "lef/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttsky26c
